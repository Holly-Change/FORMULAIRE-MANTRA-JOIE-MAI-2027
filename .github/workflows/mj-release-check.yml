name: Check Mantra Joie release

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: Google Drive ID of the release ZIP
        required: true
        type: string
      version:
        description: Release version (for example v3.86-2027)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mj-release-check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check release ZIP
        env:
          MJ_RELEASE_FILE_ID: ${{ inputs.drive_file_id }}
          MJ_RELEASE_VERSION: ${{ inputs.version }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 .github/scripts/check_mj_release.py
